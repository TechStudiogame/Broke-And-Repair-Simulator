name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Unity Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity project
        run: |
          ls -la
          ls -la "PhoneRepairUnity_Project (1)"
          test -f "PhoneRepairUnity_Project (1)/ProjectSettings/ProjectVersion.txt"

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: "PhoneRepairUnity_Project (1)"
          targetPlatform: Android
          buildName: PhoneRepair
          buildsPath: build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneRepair-APK
          path: build/**/*.apk
          if-no-files-found: error
